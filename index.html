<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAKTI - Dashboard Evaluasi Sekolah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        /* Scrollbar Halus */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        /* Transisi Sidebar */
        .sidebar-item { transition: all 0.2s; border-left: 3px solid transparent; }
        .sidebar-item.active { background-color: #eff6ff; border-left-color: #2563eb; color: #1e40af; }
        .sidebar-item:hover:not(.active) { background-color: #f9fafb; }

        /* Animasi Konten Dashboard */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- INTRO SEQUENCE STYLES --- */
        #intro-layer {
            position: fixed;
            inset: 0;
            background-color: black;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        /* Animasi Utama SAKTI - Cinematic Zoom & Blur */
        .intro-text-main {
            font-size: 6rem;
            font-weight: 900;
            letter-spacing: 0.5rem;
            opacity: 0;
            background: linear-gradient(to bottom, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: blur(10px);
            transform: scale(1.5);
            text-shadow: 0 0 30px rgba(255,255,255,0.3);
        }

        .intro-active .intro-text-main {
            animation: cinematicReveal 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes cinematicReveal {
            0% {
                opacity: 0;
                filter: blur(20px);
                transform: scale(1.8);
                letter-spacing: 1.5rem;
            }
            100% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1);
                letter-spacing: 0.5rem;
            }
        }

        /* Container Sub Text */
        .intro-text-sub {
            margin-top: 1.5rem;
            font-size: 1.25rem;
            font-weight: 400;
            color: #cbd5e1;
            text-align: center;
            min-height: 30px; /* Menjaga layout agar tidak geser */
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2px; /* Jarak antar huruf sedikit */
        }

        /* Animasi Huruf Bouncing */
        .intro-char {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
        }

        .intro-char.animate-bounce-in {
            animation: bounceInChar 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Keyframe Bounce: Muncul dari bawah, sedikit overshoot ke atas, lalu turun */
        @keyframes bounceInChar {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.8);
            }
            60% {
                opacity: 1;
                transform: translateY(-10px) scale(1.1);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Flash Putih */
        #intro-flash {
            position: fixed;
            inset: 0;
            background-color: white;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
        }

        /* Responsif Intro */
        @media (max-width: 768px) {
            .intro-text-main { font-size: 3.5rem; letter-spacing: 0.2rem; }
            .intro-text-sub { font-size: 0.9rem; padding: 0 20px; }
            @keyframes cinematicReveal {
                0% { opacity: 0; filter: blur(10px); transform: scale(1.5); letter-spacing: 0.5rem; }
                100% { opacity: 1; filter: blur(0); transform: scale(1); letter-spacing: 0.2rem; }
            }
        }

        /* --- CUSTOM LOGIN STYLES --- */
        #login-overlay { 
            position: fixed; 
            inset: 0; 
            z-index: 50; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-image: url('https://lh3.googleusercontent.com/d/1k3NhekvpCpZofQOCerTrmx7lMXh-I93g');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0; /* Default opacity 0 */
            transition: opacity 1.5s ease-in;
        }

        @media (min-width: 768px) {
            #login-overlay {
                justify-content: flex-end; 
                padding-right: 5%; 
            }
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #1f2937;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            transform: scale(0.98);
            opacity: 0.9;
        }

        .login-card:hover, .login-card:focus-within {
            background-color: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(0);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: scale(1); 
            opacity: 1;
            border-color: white;
        }
        
        .login-input {
            background-color: rgba(255, 255, 255, 0.7) !important;
            transition: background-color 0.3s;
        }
        .login-card:hover .login-input {
            background-color: #fff !important;
        }
    </style>
</head>

        // URL SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVaCEKo5uut1StJltwkkOg2JqDleKb8hzgYzH8vXtqLDWSCAALAhBvq1Fc09OrDeD_/exec"; 

        // --- INTRO ANIMATION LOGIC ---
        function playCinematicBoom() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                const filter = ctx.createBiquadFilter();

                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(80, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5); 

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(100, ctx.currentTime + 1);

                gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2); 

                osc.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 2.5);
            } catch(e) {
                console.log("Audio blocked");
            }
        }

        function runIntroSequence() {
            const introLayer = document.getElementById('intro-layer');

            const subTextContainer = document.getElementById('intro-sub-text');

            // 1. Siapkan Text Bounce per Huruf
            const textToAnimate = "Sistem Asesmen dan Kurikulum Terintegrasi";
            subTextContainer.innerHTML = textToAnimate.split('').map(char => {
                // Jika spasi, gunakan non-breaking space agar layout aman
                if (char === ' ') return '<span class="intro-char mx-1">&nbsp;</span>';
                return `<span class="intro-char">${char}</span>`;
            }).join('');

            // 2. Mulai Animasi Utama "SAKTI"
            setTimeout(() => {
                introLayer.classList.add('intro-active');
            }, 300);

            // 3. Mulai Animasi Bounce per Huruf (setelah SAKTI muncul sebagian)
            setTimeout(() => {
                const chars = document.querySelectorAll('.intro-char');
                chars.forEach((char, index) => {
                    // Delay bertingkat untuk efek "ngetik" + bounce
                    setTimeout(() => {
                        char.classList.add('animate-bounce-in');
                    }, index * 35); // 35ms per huruf
                });
            }, 1200); // Mulai di detik ke 1.2

            // 4. Klimaks & Flash (Sesuaikan waktu agar selesai setelah teks sub muncul semua)
            // Total durasi sub text kira-kira: 40 huruf * 35ms = 1400ms + 1200ms start = 2600ms
            // Kita set flash di 3800ms agar user sempat baca sebentar
            setTimeout(() => {
                playCinematicBoom();
                flashLayer.style.transition = 'opacity 0.1s ease-in';
                flashLayer.style.opacity = '1';

                setTimeout(() => {
                    introLayer.style.display = 'none';
                    loginOverlay.style.opacity = '1';
                    
                    flashLayer.style.transition = 'opacity 1.5s ease-out';
                    flashLayer.style.opacity = '0';
                    
                    setTimeout(() => { flashLayer.remove(); }, 1500);
                }, 150); 

            }, 3800);
        }

        // --- LOGIC HELPERS ---

        function updateCheckboxValue(inputName, el) {
            const checkboxes = document.querySelectorAll(`input[onchange="updateCheckboxValue('${inputName}', this)"]:checked`);
            const values = Array.from(checkboxes).map(cb => cb.value);
            document.getElementById(inputName).value = values.join(", ");
            calculateProgress();
        }

        function handleSelectWithOther(inputName, value) {
            const otherInput = document.getElementById(`other_${inputName}`);
            const hiddenInput = document.getElementById(inputName);

            if (value === 'Lainnya') {
                otherInput.classList.remove('hidden');
                otherInput.setAttribute('required', 'true');
                otherInput.focus();
                hiddenInput.value = otherInput.value; 
            } else {
                otherInput.classList.add('hidden');
                otherInput.removeAttribute('required');
                hiddenInput.value = value; 
            }
            calculateProgress();
        }

        function handleConditional(triggerId, value) {
            const targets = document.querySelectorAll(`[data-trigger-source="${triggerId}"]`);
            targets.forEach(target => {
                const showValue = target.getAttribute('data-show-if');
                const inputs = target.querySelectorAll('input, select, textarea');
                
                if (value === showValue) {
                    target.classList.remove('hidden');
                } else {
                    target.classList.add('hidden');
                    inputs.forEach(input => {
                        // Hanya reset jika ini bukan radio button, atau uncheck jika radio
                        if(input.type === 'radio') {
                            input.checked = false;
                        } else {
                            input.value = '';
                        }
                        if(input.id && input.id.startsWith('other_')) input.classList.add('hidden');
                    });
                    const selects = target.querySelectorAll('select');
                    selects.forEach(sel => sel.value = '');
                }
            });
            calculateProgress();
        }

        // --- INTERACTION LOGIC ---
        function switchSection(index) {
            sections.forEach((_, i) => {
                document.getElementById(`section-${i}`).classList.add('hidden');
            });
            document.getElementById(`section-${index}`).classList.remove('hidden');
            
            currentSectionIndex = index;
            highlightMenu(index);
            updateNavButtons();
            document.getElementById('main-scroll').scrollTop = 0;
            document.getElementById('mobile-menu').classList.add('hidden');
        }

        function highlightMenu(index) {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`menu-item-${index}`).classList.add('active');
        }

        function navigate(direction) {
            const newIndex = currentSectionIndex + direction;
            if (newIndex >= 0 && newIndex < sections.length) {
                switchSection(newIndex);
            }
        }

        function updateNavButtons() {
            const prev = document.getElementById('btnPrev');
            const next = document.getElementById('btnNext');
            const submit = document.getElementById('btnSubmit');

            if (currentSectionIndex === 0) {
                prev.classList.add('hidden');
            } else {
                prev.classList.remove('hidden');
            }

            if (currentSectionIndex === sections.length - 1) {
                next.classList.add('hidden');
                submit.classList.remove('hidden');
            } else {
                next.classList.remove('hidden');
                submit.classList.add('hidden');
            }
        }

        function toggleQuestions(idx, val) {
            const wrapper = document.getElementById(`q-wrapper-${idx}`);
            const sectionId = sections[idx].id;

            // --- LOGIKA KHUSUS KOKURIKULER ---
            if (sectionId === 'koku') {
                wrapper.classList.remove('hidden');
                wrapper.style.maxHeight = "8000px";

                const modeYaItems = wrapper.querySelectorAll('.mode-ya');
                const modeTidakItems = wrapper.querySelectorAll('.mode-tidak');
                // Ambil referensi ke wrapper Bukti dan Dokumen
                const buktiWrapper = document.getElementById(`bukti-wrapper-${sectionId}`);
                const docWrapper = document.getElementById(`doc-wrapper-${sectionId}`);
                
                // Reset semua required dulu
                wrapper.querySelectorAll('.child-input').forEach(i => i.removeAttribute('required'));

                if (val === 'Ya') {
                    // Tampilkan Item YA, Sembunyikan Item TIDAK
                    modeYaItems.forEach(el => {
                        if(!el.hasAttribute('data-trigger-source')) {
                            el.classList.remove('hidden');
                        }
                    });
                    
                    modeTidakItems.forEach(el => el.classList.add('hidden'));
                    
                    // TAMPILKAN Bukti & Dokumen
                    if(buktiWrapper) buktiWrapper.classList.remove('hidden');
                    if(docWrapper) docWrapper.classList.remove('hidden');
                    
                    // Set Required untuk item yang visible (Hanya yang tidak hidden)
                    modeYaItems.forEach(g => {
                         if(!g.classList.contains('hidden')) {
                             g.querySelectorAll('.child-input').forEach(i => i.setAttribute('required', 'true'));
                         }
                    });
                } else {
                    // Tampilkan Item TIDAK (Alasan), Sembunyikan Item YA
                    modeYaItems.forEach(el => el.classList.add('hidden'));
                    modeTidakItems.forEach(el => el.classList.remove('hidden'));
                    
                    // SEMBUNYIKAN Bukti & Dokumen
                    if(buktiWrapper) {
                        buktiWrapper.classList.add('hidden');
                        buktiWrapper.querySelectorAll('input').forEach(i => i.value = ''); 
                    }
                    if(docWrapper) {
                        docWrapper.classList.add('hidden');
                        docWrapper.querySelectorAll('input').forEach(i => i.value = '');
                    }
                    
                    // Set Required untuk item yang visible
                    modeTidakItems.forEach(g => g.querySelectorAll('.child-input').forEach(i => i.setAttribute('required', 'true')));
                }
            } 
            // --- LOGIKA STANDAR (PM, KKA, TKA, KSP, dll) ---
            else {
                const inputs = wrapper.querySelectorAll('.child-input');
                if (val === 'Ya') {
                    wrapper.classList.remove('hidden');
                    wrapper.style.maxHeight = "8000px"; 
                    inputs.forEach(inp => {
                        const parentHidden = inp.closest('[data-trigger-source]')?.classList.contains('hidden');
                        const isOptional = inp.hasAttribute('data-optional');
                        if (!parentHidden && !isOptional) inp.setAttribute('required', 'true');
                    });
                    
                    if(sectionId === 'ksp') {
                         const buktiW = document.getElementById(`bukti-wrapper-${sectionId}`);
                         if(buktiW) buktiW.classList.add('hidden');
                    }
                } else {
                    wrapper.style.maxHeight = "0px";
                    setTimeout(() => wrapper.classList.add('hidden'), 500);
                    inputs.forEach(inp => { inp.removeAttribute('required'); inp.value = ''; });
                }
            }
            calculateProgress();
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // --- PROGRESS LOGIC ---
        function calculateProgress() {
            const form = document.getElementById('evalForm');
            let totalItems = 2; 
            let completedItems = 0;

            if (form.nama_responden.value.trim()) completedItems++;
            if (form.no_wa.value.trim()) completedItems++;

            sections.forEach((sec, idx) => {
                let sectionTotal = 1; 
                let sectionFilled = 0;
                
                const keyVal = form.elements[`key_${sec.id}`].value;
                if (keyVal) sectionFilled++;

                // Logika Progress juga harus mengakomodir Koku
                if (sec.id === 'koku') {
                     if (keyVal === 'Ya') {
                        sectionTotal += 11; // Estimasi pertanyaan Ya
                     } else if (keyVal === 'Tidak') {
                        sectionTotal += 1; // Hanya pertanyaan Alasan
                     }
                } else {
                    if (keyVal === 'Ya') {
                        sectionTotal += 10; 
                    } else if (keyVal === 'Tidak') {
                        sectionTotal = 1;
                        sectionFilled = 1;
                    }
                }

                if (keyVal === 'Ya' || (sec.id === 'koku' && keyVal === 'Tidak')) {
                    const container = document.getElementById(`section-${idx}`);
                    const validInputs = container.querySelectorAll('input.child-input:not([type=hidden]), select.child-input, textarea.child-input');
                    
                    validInputs.forEach(el => {
                         // Ignore if hidden (class hidden di parent wrapper atau conditional)
                         if(el.closest('.hidden')) return;
                         // Check radio buttons specifically
                         if(el.type === 'radio') {
                             if(el.checked) sectionFilled++;
                         } else {
                             if(el.value.trim()) sectionFilled++;
                         }
                    });
                }

                // Visual checkmark
                const checkIcon = document.getElementById(`check-${idx}`);
                if (keyVal) {
                    if(keyVal === 'Tidak' && sec.id !== 'koku') {
                        checkIcon.classList.remove('opacity-0');
                    } else if ((keyVal === 'Ya' || (sec.id === 'koku' && keyVal === 'Tidak')) && sectionFilled > 1) {
                        checkIcon.classList.remove('opacity-0');
                    } else {
                        checkIcon.classList.add('opacity-0');
                    }
                } else {
                    checkIcon.classList.add('opacity-0');
                }

                totalItems += sectionTotal;
                completedItems += sectionFilled;
            });

            const percent = Math.round((completedItems / totalItems) * 100) || 0;
            const finalPercent = percent > 100 ? 100 : percent;
            document.getElementById('global-progress').style.width = `${finalPercent}%`;
            document.getElementById('global-progress-text').innerText = `${finalPercent}%`;
        }

        // --- LOGIN LOGIC ---
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if(!SCRIPT_URL) { showModal('error', "Script URL belum disetting!"); return; }
            
            const npsn = document.getElementById('npsnInput').value;
            const btn = document.getElementById('btnLogin');
            const err = document.getElementById('loginError');
            
            btn.disabled = true; 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            err.classList.add('hidden');

            fetch(SCRIPT_URL + '?action=login&npsn=' + npsn, { method: "POST" })
            .then(res => res.json())
            .then(data => {
                if(data.result === 'success') {
                    document.getElementById('hidden_npsn').value = data.data.npsn;
                    document.getElementById('hidden_nama_sekolah').value = data.data.nama_sekolah;
                    document.getElementById('schoolNameDisplay').innerText = data.data.nama_sekolah;
                    document.getElementById('npsnDisplay').innerText = `NPSN: ${data.data.npsn}`;
                    
                    document.getElementById('login-overlay').style.opacity = 0;
                    setTimeout(() => document.getElementById('login-overlay').remove(), 500);
                } else {
                    err.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Masuk Dashboard</span> <i class="fas fa-arrow-right"></i>';
                }
            }).catch(() => {
                showModal('error', "Gagal koneksi.");
                btn.disabled = false;
                btn.innerHTML = '<span>Masuk Dashboard</span> <i class="fas fa-arrow-right"></i>';
            });
        });

        // --- SUBMIT LOGIC ---
        document.getElementById('evalForm').addEventListener('submit', function(e) {
            e.preventDefault();
            showModal('loading', 'Mengirim Data...');
            
            fetch(SCRIPT_URL, { method: 'POST', body: new FormData(this) })
            .then(res => res.json())
            .then(data => {
                if(data.result === 'success') {
                    showModal('success', 'Terkirim!');
                    setTimeout(() => location.reload(), 2000);
                } else {
                    showModal('error', 'Gagal: ' + data.message);
                }
            })
            .catch(() => showModal('error', 'Error koneksi'));
        });

        function showModal(type, msg) {
            const m = document.getElementById('modal');
            m.classList.remove('hidden');
            let html = '';
            if(type == 'loading') html = '<i class="fas fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i><p>'+msg+'</p>';
            else if(type == 'success') html = '<i class="fas fa-check-circle text-4xl text-green-500 mb-3"></i><p>'+msg+'</p>';
            else html = '<i class="fas fa-times-circle text-4xl text-red-500 mb-3"></i><p>'+msg+'</p><button onclick="document.getElementById(\'modal\').classList.add(\'hidden\')" class="mt-3 text-sm underline">Tutup</button>';
            document.getElementById('modal-content').innerHTML = html;
        }
    </script>
</body>
</html>
