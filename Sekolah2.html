<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAKTI - Dashboard Evaluasi Sekolah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://disdik.jakarta.go.id/static/disdik/images/logo/logo.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        .sidebar-item { transition: all 0.2s; border-left: 3px solid transparent; }
        .sidebar-item.active { background-color: #eff6ff; border-left-color: #2563eb; color: #1e40af; }
        .sidebar-item:hover:not(.active) { background-color: #f9fafb; }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        #intro-layer {
            position: fixed; inset: 0; background-color: black; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; overflow: hidden;
        }
        .intro-text-main {
            font-size: 6rem; font-weight: 900; letter-spacing: 0.5rem; opacity: 0;
            background: linear-gradient(to bottom, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: blur(10px); transform: scale(1.5);
            text-shadow: 0 0 30px rgba(255,255,255,0.3);
        }
        .intro-active .intro-text-main { animation: cinematicReveal 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes cinematicReveal {
            0% { opacity: 0; filter: blur(20px); transform: scale(1.8); letter-spacing: 1.5rem; }
            100% { opacity: 1; filter: blur(0); transform: scale(1); letter-spacing: 0.5rem; }
        }
        .intro-text-sub { margin-top: 1.5rem; font-size: 1.25rem; font-weight: 400; color: #cbd5e1; text-align: center; min-height: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
        .intro-char { display: inline-block; opacity: 0; transform: translateY(20px); }
        .intro-char.animate-bounce-in { animation: bounceInChar 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes bounceInChar {
            0% { opacity: 0; transform: translateY(30px) scale(0.8); }
            60% { opacity: 1; transform: translateY(-10px) scale(1.1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        #intro-flash { position: fixed; inset: 0; background-color: white; z-index: 10000; opacity: 0; pointer-events: none; }

        #login-overlay { 
            position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; 
            background-image: url('https://lh3.googleusercontent.com/d/1k3NhekvpCpZofQOCerTrmx7lMXh-I93g');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            opacity: 0; transition: opacity 1.5s ease-in;
        }
        @media (min-width: 768px) { #login-overlay { justify-content: flex-end; padding-right: 5%; } }
        
        .login-card {
            background-color: rgba(255, 255, 255, 0.25); backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.3); color: #1f2937;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(0.98); opacity: 0.9;
        }
        .login-card:hover, .login-card:focus-within {
            background-color: rgba(255, 255, 255, 0.98); backdrop-filter: blur(0);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: scale(1); opacity: 1; border-color: white;
        }
        .login-input { background-color: rgba(255, 255, 255, 0.7) !important; transition: background-color 0.3s; }
        .login-card:hover .login-input { background-color: #fff !important; }

        @media (max-width: 768px) {
            .intro-text-main { font-size: 3.5rem; letter-spacing: 0.2rem; }
            .intro-text-sub { font-size: 0.9rem; padding: 0 20px; }
        }
        
        #draft-indicator {
            position: fixed; bottom: 20px; right: 20px; background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #e2e8f0; padding: 10px 16px; border-radius: 50px; font-size: 0.8rem; font-weight: 600; color: #475569;
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.1); display: flex; align-items: center; gap: 8px; z-index: 50;
            opacity: 0; transform: translateY(20px); transition: all 0.3s ease-out; pointer-events: none;
        }
        #draft-indicator.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- INTRO LAYER -->
    <div id="intro-layer">
        <h1 class="intro-text-main">SAKTI</h1>
        <div id="intro-sub-text" class="intro-text-sub"></div>
    </div>
    <div id="intro-flash"></div>

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay">
        <div class="login-card p-8 rounded-2xl shadow-xl w-full max-w-sm mx-4 md:mx-0 text-center">
            <img src="https://disdik.jakarta.go.id/static/disdik/images/logo/logo.png" class="w-16 h-16 mx-auto mb-4 object-contain" alt="Logo Disdik">
            <h2 class="text-2xl font-bold text-gray-900 mb-1 drop-shadow-sm">Portal SAKTI</h2>
            <p class="text-gray-800 font-medium text-sm mb-6 drop-shadow-sm">Silakan masuk</p>
            
            <form id="loginForm" class="space-y-4">
                <div class="relative group">
                    <input type="text" id="npsnInput" required class="login-input w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-center text-lg font-bold tracking-widest placeholder-gray-500" placeholder="NPSN (Username)">
                </div>
                <div class="relative group">
                    <input type="password" id="passwordInput" required class="login-input w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-center text-md font-medium placeholder-gray-500" placeholder="Password">
                </div>
                <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg flex justify-center items-center gap-2 transform hover:scale-[1.02]">
                    <span>Masuk Dashboard</span> <i class="fas fa-arrow-right"></i>
                </button>
                <div id="loginError" class="text-red-600 bg-red-100/90 p-2 rounded-lg text-sm hidden mt-2 font-semibold border border-red-200">
                    <i class="fas fa-exclamation-circle"></i> NPSN atau Password salah.
                </div>
            </form>
        </div>
    </div>

    <!-- SIDEBAR (DESKTOP) -->
    <aside class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col hidden md:flex h-full">
        <div class="h-16 flex items-center px-6 border-b border-gray-200">
            <a href="./" class="font-bold text-xl text-blue-700 flex items-center gap-2 hover:text-blue-800 transition">
                <i class="fas fa-chart-pie"></i> SAKTI
            </a>
        </div>
        
        <div class="px-3 pt-4">
             <a href="./" class="sidebar-item cursor-pointer px-6 py-3 flex items-center justify-between text-sm font-medium text-gray-600 hover:bg-gray-50 rounded-lg decoration-transparent">
                <div class="flex items-center gap-3">
                    <i class="fas fa-home w-5 text-center"></i>
                    <span>Home</span>
                </div>
            </a>
        </div>

        <div class="flex-1 overflow-y-auto py-2 space-y-1" id="sidebar-menu"></div>
        <div class="p-4 border-t border-gray-200 bg-gray-50">
            <div class="text-xs font-semibold text-gray-500 uppercase mb-2">Progress Total</div>
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-1">
                <div id="global-progress" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="text-right text-xs text-gray-600 font-bold" id="global-progress-text">0%</div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 md:hidden z-10">
            <span class="font-bold text-gray-800">SAKTI Dashboard</span>
            <button onclick="toggleMobileMenu()" class="text-gray-600 hover:text-blue-600">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </header>

        <div id="mobile-menu" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden" onclick="toggleMobileMenu()">
            <div class="bg-white w-64 h-full shadow-lg p-4" onclick="event.stopPropagation()">
                <div class="text-lg font-bold mb-4 border-b pb-2">Menu Evaluasi</div>
                <div id="mobile-sidebar-menu" class="space-y-2"></div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth" id="main-scroll">
            
            <div id="status-banner" class="hidden max-w-4xl mx-auto mb-4 p-4 rounded-xl border flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-3">
                    <div id="status-icon" class="w-10 h-10 rounded-full flex items-center justify-center text-white text-lg"></div>
                    <div>
                        <h3 id="status-title" class="font-bold text-lg"></h3>
                        <p id="status-desc" class="text-sm"></p>
                    </div>
                </div>
                <button id="btn-request-edit" onclick="requestEdit()" class="hidden px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-white rounded-lg font-bold text-sm shadow transition">
                    <i class="fas fa-edit mr-2"></i> Ajukan Perubahan
                </button>
            </div>

            <form id="evalForm" class="max-w-4xl mx-auto pb-20">
                <div class="bg-white rounded-xl shadow-sm p-6 mb-6 border border-gray-200 relative">
                    <button type="button" onclick="logout()" class="absolute top-6 right-6 text-red-500 hover:text-red-700 text-sm font-semibold flex items-center gap-2 transition">
                        <i class="fas fa-sign-out-alt"></i> Keluar
                    </button>

                    <div class="flex justify-between items-start pr-20">
                        <div>
                            <h1 id="schoolNameDisplay" class="text-2xl font-bold text-gray-900">Memuat Data...</h1>
                            <p id="npsnDisplay" class="text-gray-500 font-mono text-sm mt-1">NPSN: -</p>
                        </div>
                        <div class="text-right hidden md:block">
                            <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded border border-blue-200">Tahun 2025</span>
                        </div>
                    </div>
                    
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Wilayah / Suku Dinas</label>
                        <input type="text" name="wilayah" id="wilayahInput" readonly class="w-full bg-gray-50 border-none text-sm text-gray-700 font-medium p-0 focus:ring-0" placeholder="-" required>
                    </div>
                </div>

                <input type="hidden" name="npsn_sekolah" id="hidden_npsn">
                <input type="hidden" name="nama_sekolah" id="hidden_nama_sekolah">
                <input type="hidden" name="kecamatan" id="hidden_kecamatan">
                <input type="hidden" name="kelurahan" id="hidden_kelurahan">
                <input type="hidden" name="sudin" id="hidden_sudin">
                <input type="hidden" name="kota" id="hidden_kota">

                <div id="content-area"></div>

                <div class="flex justify-between mt-8">
                    <button type="button" id="btnPrev" onclick="navigate(-1)" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium hidden">
                        <i class="fas fa-arrow-left mr-2"></i> Sebelumnya
                    </button>
                    <button type="button" id="btnNext" onclick="navigate(1)" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium ml-auto">
                        Selanjutnya <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                    <button type="submit" id="btnSubmit" class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium shadow-lg ml-auto hidden">
                        <i class="fas fa-save mr-2"></i> Simpan Permanen ke Database
                    </button>
                </div>
            </form>
        </div>
    </main>

    <div id="draft-indicator">
        <i class="fas fa-check-circle text-green-500"></i>
        <span>Data tersimpan (Draft)</span>
    </div>

    <!-- Modal Notifications -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- MAIN SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        window.toggleMobileMenu = function() {
            const menu = document.getElementById('mobile-menu');
            if(menu) menu.classList.toggle('hidden');
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDOYIAjVph2Jwpb0xTSGad1Zlg0DdMlmfU",
            authDomain: "sakti-sd.firebaseapp.com",
            projectId: "sakti-sd",
            storageBucket: "sakti-sd.firebasestorage.app",
            messagingSenderId: "642095360646",
            appId: "1:642095360646:web:5b1e90d62f52e7a3e9bf07"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentSchoolData = {};

        // --- OPTIMISASI AUTO SAVE (LOCALSTORAGE) ---
        function debounce(func, timeout = 1000) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => { func.apply(this, args); }, timeout);
            };
        }

        const runAutoSave = debounce(() => {
            const npsn = document.getElementById('hidden_npsn').value;
            // Jangan simpan jika belum login atau jika mode locked aktif
            const banner = document.getElementById('status-banner');
            const isLocked = !banner.classList.contains('hidden') && document.getElementById('status-title').innerText === 'Data Terkirim';
            
            if (!npsn || isLocked) return;

            const indicator = document.getElementById('draft-indicator');
            if(indicator) {
                indicator.innerHTML = '<i class="fas fa-pen-nib text-blue-500"></i> <span>Menyimpan ke Perangkat...</span>';
                indicator.classList.add('visible');
            }

            const formData = {};
            const form = document.getElementById('evalForm');
            const elements = form.elements;
            
            for (let i = 0; i < elements.length; i++) {
                const el = elements[i];
                if (el.name && !el.disabled) {
                    if (el.type === 'radio') {
                        if (el.checked) formData[el.name] = el.value;
                    } else if (el.type === 'checkbox') {
                         // Value checkbox diambil dari hidden input yang dihandle function updateCheckboxValue
                    } else {
                        formData[el.name] = el.value;
                    }
                }
            }

            formData.updatedAt = new Date().toISOString();
            
            // SIMPAN KE LOCALSTORAGE (GRATIS, CEPAT, HEMAT KUOTA WRITE)
            try {
                const draftKey = `sakti_draft_${npsn}`;
                localStorage.setItem(draftKey, JSON.stringify(formData));

                if(indicator) {
                    indicator.innerHTML = '<i class="fas fa-laptop text-green-500"></i> <span>Tersimpan di Browser</span>';
                    setTimeout(() => { 
                        if(!indicator.innerHTML.includes('fa-pen-nib')) {
                            indicator.classList.remove('visible'); 
                        }
                    }, 2000);
                }
            } catch (error) {
                console.error("Local save failed:", error);
            }
        });

        // FUNGSI SYNC KE FIREBASE (HANYA DIPANGGIL SAAT NAVIGASI / SUBMIT)
        async function syncToFirebase() {
            const npsn = document.getElementById('hidden_npsn').value;
            const draftKey = `sakti_draft_${npsn}`;
            const draftData = localStorage.getItem(draftKey);
            
            if (!npsn || !draftData) return;

            const indicator = document.getElementById('draft-indicator');
            if(indicator) {
                indicator.innerHTML = '<i class="fas fa-cloud-upload-alt fa-bounce text-blue-600"></i> <span>Sinkronisasi Cloud...</span>';
                indicator.classList.add('visible');
            }

            try {
                const data = JSON.parse(draftData);
                await setDoc(doc(db, "evaluasi_sekolah", npsn), data, { merge: true });
                
                if(indicator) {
                    indicator.innerHTML = '<i class="fas fa-check-double text-green-600"></i> <span>Tersimpan di Cloud</span>';
                    setTimeout(() => indicator.classList.remove('visible'), 2000);
                }
            } catch (e) {
                console.error("Sync failed:", e);
                if(indicator) indicator.innerHTML = '<i class="fas fa-exclamation-triangle text-orange-500"></i> <span>Gagal Sync Cloud</span>';
            }
        }

        const mapelOptions = ["Pendidikan Agama Islam dan Budi Pekerti", "Pendidikan Agama Kristen dan Budi Pekerti", "Pendidikan Agama Katolik dan Budi Pekerti", "Pendidikan Agama Buddha dan Budi Pekerti", "Pendidikan Agama Hindu dan Budi Pekerti", "Pendidikan Agama Konghucu dan Budi Pekerti", "Pendidikan Pancasila", "Bahasa Indonesia", "Matematika", "Ilmu Pengetahuan Alam dan Sosial", "Pendidikan Jasmani Olahraga dan Kesehatan", "Seni Musik", "Seni Rupa", "Seni Teater", "Seni Tari", "Bahasa Inggris", "Koding dan Kercerdasan Artifisial", "Pendidikan Lingkungan dan Budaya Jakarta", "Lainnya"];

        const sections = [
            { id: 'profil', title: 'Profil Sekolah', short: 'Profil', icon: 'fa-id-card', desc: 'Perbarui data identitas sekolah dan password login.', keyQuestion: "Pastikan data sekolah Anda mutakhir.", isCustom: true },

            }
            renderSidebar();
            setTimeout(() => {
                const npsn = localStorage.getItem('sakti_npsn');
                if(npsn) {
                    fetchFreshSchoolData(npsn).then(() => {

        async function fetchFreshSchoolData(npsn) {
            try {
                const docRef = doc(db, "data_sekolah", npsn);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {

        function updateCheckboxValue(inputName, el, triggerId) {
            const checkboxes = document.querySelectorAll(`input[onchange^="updateCheckboxValue('${inputName}'"]:checked`);
            const values = Array.from(checkboxes).map(cb => cb.value);
            const otherInput = document.getElementById(`other_text_${inputName}`);
            if(otherInput) { if(values.includes('Lainnya')) { otherInput.classList.remove('hidden'); otherInput.setAttribute('required', 'true'); } else { otherInput.classList.add('hidden'); otherInput.removeAttribute('required'); otherInput.value = ''; } }
            let finalVal = values.join(", ");
            if(otherInput && !otherInput.classList.contains('hidden') && otherInput.value.trim()) { finalVal = finalVal.replace("Lainnya", "Lainnya: " + otherInput.value); }
            document.getElementById(inputName).value = finalVal;
            if (triggerId && triggerId !== 'undefined' && triggerId !== '') { const targets = document.querySelectorAll(`[data-trigger-source="${triggerId}"]`); targets.forEach(target => { if (target.getAttribute('data-show-if') === 'any_checked') { if (values.length > 0) target.classList.remove('hidden'); else target.classList.add('hidden'); } }); }
            calculateProgress();
        }

        function handleSelectWithOther(inputName, value) {
            const otherInput = document.getElementById(`other_${inputName}`);
            const hiddenInput = document.getElementById(inputName);
            if (value === 'Lainnya') { otherInput.classList.remove('hidden'); otherInput.setAttribute('required', 'true'); otherInput.focus(); hiddenInput.value = otherInput.value; } else { otherInput.classList.add('hidden'); otherInput.removeAttribute('required'); hiddenInput.value = value; }
            calculateProgress();
        }

        function handleConditional(triggerId, value) {
            const targets = document.querySelectorAll(`[data-trigger-source="${triggerId}"]`);
            targets.forEach(target => {
                const showValue = target.getAttribute('data-show-if');
                const inputs = target.querySelectorAll('input, select, textarea');
                if (value === showValue) { target.classList.remove('hidden'); } else { target.classList.add('hidden'); inputs.forEach(input => { if(input.type === 'radio') input.checked = false; else input.value = ''; if(input.id && input.id.startsWith('other_')) input.classList.add('hidden'); }); target.querySelectorAll('select').forEach(sel => sel.value = ''); }
            });
            calculateProgress();
        }

        function switchSection(index) {
            sections.forEach((_, i) => document.getElementById(`section-${i}`).classList.add('hidden'));
            document.getElementById(`section-${index}`).classList.remove('hidden');

        function toggleQuestions(idx, val) {
            const wrapper = document.getElementById(`q-wrapper-${idx}`);
            const sectionId = sections[idx].id;
            const modeYaItems = wrapper.querySelectorAll('.mode-ya');
            const modeTidakItems = wrapper.querySelectorAll('.mode-tidak');
            const buktiWrapper = document.getElementById(`bukti-wrapper-${sectionId}`);
            const docWrapper = document.getElementById(`doc-wrapper-${sectionId}`);
            if (['koku', 'kka', 'pm', 'tka', 'dp', 'asesmen', 'ksp'].includes(sectionId)) {
                wrapper.classList.remove('hidden'); wrapper.style.maxHeight = "8000px"; wrapper.querySelectorAll('.child-input').forEach(i => i.removeAttribute('required'));
                if (val === 'Ya') { modeYaItems.forEach(el => { if (!el.getAttribute('data-trigger-source')) el.classList.remove('hidden'); }); modeTidakItems.forEach(el => el.classList.add('hidden')); if(sectionId === 'koku' || sectionId === 'asesmen') { if(buktiWrapper) buktiWrapper.classList.remove('hidden'); if(docWrapper) docWrapper.classList.remove('hidden'); } else { if(buktiWrapper) buktiWrapper.classList.add('hidden'); if(docWrapper) docWrapper.classList.add('hidden'); } modeYaItems.forEach(g => { if(!g.classList.contains('hidden')) g.querySelectorAll('.child-input').forEach(i => i.setAttribute('required', 'true')); }); } 
                else { modeYaItems.forEach(el => el.classList.add('hidden')); modeTidakItems.forEach(el => el.classList.remove('hidden')); if(buktiWrapper) { buktiWrapper.classList.add('hidden'); buktiWrapper.querySelectorAll('input').forEach(i => i.value = ''); } if(docWrapper) { docWrapper.classList.add('hidden'); docWrapper.querySelectorAll('input').forEach(i => i.value = ''); } modeTidakItems.forEach(g => g.querySelectorAll('.child-input').forEach(i => i.setAttribute('required', 'true'))); }
            } else {
                const inputs = wrapper.querySelectorAll('.child-input');
                if (val === 'Ya') { wrapper.classList.remove('hidden'); wrapper.style.maxHeight = "8000px"; inputs.forEach(inp => { if (!inp.closest('[data-trigger-source]')?.classList.contains('hidden') && !inp.hasAttribute('data-optional')) inp.setAttribute('required', 'true'); }); if(document.getElementById(`bukti-wrapper-${sectionId}`)) document.getElementById(`bukti-wrapper-${sectionId}`).classList.add('hidden'); } 
                else { wrapper.style.maxHeight = "0px"; setTimeout(() => wrapper.classList.add('hidden'), 500); inputs.forEach(inp => { inp.removeAttribute('required'); inp.value = ''; }); }
            }
            calculateProgress();
        }

        function calculateProgress() {
            // TRIGGER AUTO SAVE (LOCAL STORAGE)
            runAutoSave();

            const form = document.getElementById('evalForm');
            let totalItems = 2; let completedItems = 0;
            const nr = document.getElementById('nama_responden'); const nw = document.getElementById('no_wa');
            if (nr && nr.value.trim()) completedItems++;
            if (nw && nw.value.trim()) completedItems++;

            sections.forEach((sec, idx) => {
                if (sec.id === 'profil') return;
                let sectionTotal = 1; let sectionFilled = 0;
                let keyRadio = document.querySelector(`input[name="key_${sec.id}"]:checked`);
                let keyVal = keyRadio ? keyRadio.value : null;
                if (keyVal) sectionFilled++;
                if (['koku', 'kka', 'pm', 'tka', 'dp', 'asesmen', 'ksp'].includes(sec.id)) { if (keyVal === 'Ya') { if (sec.id === 'kka') sectionTotal += 10; else if (sec.id === 'pm') sectionTotal += 13; else if (sec.id === 'tka') sectionTotal += 12; else if (sec.id === 'dp') sectionTotal += 15; else if (sec.id === 'ksp') sectionTotal += 17; else sectionTotal += 11; } else if (keyVal === 'Tidak') { if (sec.id === 'kka') sectionTotal += 6; else sectionTotal += 1; } } 
                else { if (keyVal === 'Ya') sectionTotal += 10; else if (keyVal === 'Tidak') { sectionTotal = 1; sectionFilled = 1; } }
                if (keyVal) { const container = document.getElementById(`section-${idx}`); const validInputs = container.querySelectorAll('input.child-input:not([type=hidden]), select.child-input, textarea.child-input, input[type=hidden].child-input'); validInputs.forEach(el => { if(el.closest('.hidden')) return; if(el.type === 'radio') { if(el.checked) sectionFilled++; } else { if(el.value.trim()) sectionFilled++; } }); }
                const checkIcon = document.getElementById(`check-${idx}`);
                if (keyVal && sectionFilled > 1) checkIcon.classList.remove('opacity-0'); else checkIcon.classList.add('opacity-0');
                totalItems += sectionTotal; completedItems += sectionFilled;
            });
            const percent = Math.round((completedItems / totalItems) * 100) || 0;
            const finalPercent = percent > 100 ? 100 : percent;
            document.getElementById('global-progress').style.width = `${finalPercent}%`;
            document.getElementById('global-progress-text').innerText = `${finalPercent}%`;
        }

        function checkSession() {
            const storedNPSN = localStorage.getItem('sakti_npsn');
            if (storedNPSN) {
                document.getElementById('schoolNameDisplay').innerText = localStorage.getItem('sakti_nama_sekolah') || 'Loading...';
                document.getElementById('npsnDisplay').innerText = `NPSN: ${storedNPSN}`;
                document.getElementById('hidden_npsn').value = storedNPSN;
                document.getElementById('hidden_nama_sekolah').value = localStorage.getItem('sakti_nama_sekolah') || '';
                document.getElementById('hidden_sudin').value = localStorage.getItem('sakti_sudin') || '';
                document.getElementById('wilayahInput').value = localStorage.getItem('sakti_sudin') || '';
                return true;
            }
            return false;
        }

        function logout() { if(confirm('Apakah Anda yakin ingin keluar?')) { localStorage.clear(); location.reload(); } }
        function showModal(type, msg) { const m = document.getElementById('modal'); m.classList.remove('hidden'); let html = ''; if(type == 'loading') html = '<i class="fas fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i><p>'+msg+'</p>'; else if(type == 'success') html = '<i class="fas fa-check-circle text-4xl text-green-500 mb-3"></i><p>'+msg+'</p><button onclick="document.getElementById(\'modal\').classList.add(\'hidden\')" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg text-sm">Tutup</button>'; else if(type == 'info') html = '<i class="fas fa-info-circle text-4xl text-blue-400 mb-3"></i><p>'+msg+'</p><button onclick="document.getElementById(\'modal\').classList.add(\'hidden\')" class="mt-4 px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm">OK</button>'; else html = '<i class="fas fa-times-circle text-4xl text-red-500 mb-3"></i><p class="font-bold text-red-600">Error</p><p>'+msg+'</p><button onclick="document.getElementById(\'modal\').classList.add(\'hidden\')" class="mt-4 px-4 py-2 bg-red-600 text-white rounded-lg text-sm">Tutup</button>'; document.getElementById('modal-content').innerHTML = html; }
        window.showModal = showModal;

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const npsn = document.getElementById('npsnInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const btn = document.getElementById('btnLogin');
            const err = document.getElementById('loginError');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; err.classList.add('hidden');
            try {
                const docRef = doc(db, "data_sekolah", npsn);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if(data.password == password) {
                        localStorage.setItem('sakti_npsn', data.NPSN);
                        localStorage.setItem('sakti_nama_sekolah', data.Sekolah);
                        localStorage.setItem('sakti_sudin', data.Sudin || '');
                        document.getElementById('hidden_npsn').value = data.NPSN;
                        document.getElementById('hidden_nama_sekolah').value = data.Sekolah;
                        document.getElementById('schoolNameDisplay').innerText = data.Sekolah;
                        document.getElementById('npsnDisplay').innerText = `NPSN: ${data.NPSN}`;
                        document.getElementById('wilayahInput').value = data.Sudin || '';
                        document.getElementById('hidden_sudin').value = data.Sudin || '';
                        currentSchoolData = data;
                        await loadEvaluationData(npsn);
                        renderSidebar();
                        renderContent();
                        document.getElementById('login-overlay').style.opacity = 0;
                        setTimeout(() => { document.getElementById('login-overlay').remove(); document.getElementById('intro-layer').remove(); }, 500);
                    } else { throw new Error("Password salah"); }
                } else { throw new Error("NPSN tidak ditemukan"); }
            } catch (error) { console.error(error); err.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${error.message}`; err.classList.remove('hidden'); btn.disabled = false; btn.innerHTML = '<span>Masuk Dashboard</span> <i class="fas fa-arrow-right"></i>'; }
        });

        document.getElementById('evalForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if(!confirm("Simpan Permanen? Data tidak dapat diubah kecuali dengan izin Supervisor.")) return;
            
            showModal('loading', 'Menyimpan ke Database...');
            const npsn = document.getElementById('hidden_npsn').value;
            if(!npsn) { showModal('error', 'Sesi habis, silakan login ulang.'); return; }
            
            // Ambil data terbaru dari form, jangan cuma dari localstorage karena mungkin ada perubahan last second
            const formData = {};
            const elements = this.elements;
            for (let i = 0; i < elements.length; i++) { const el = elements[i]; if (el.name && !el.disabled) { if (el.type === 'radio') { if (el.checked) formData[el.name] = el.value; } else if (el.type === 'checkbox') { } else { formData[el.name] = el.value; } } }
            
            formData.is_locked = true; 
            formData.request_edit = false;
            formData.updatedAt = new Date().toISOString();
            formData.submittedAt = new Date().toISOString();

            try { 
                await setDoc(doc(db, "evaluasi_sekolah", npsn), formData, { merge: true }); 
                // Clear Draft setelah sukses
                localStorage.removeItem(`sakti_draft_${npsn}`);
                showModal('success', 'Data Berhasil Disimpan Permanen!');
                loadEvaluationData(npsn); 
            } catch (error) { console.error(error); showModal('error', 'Gagal menyimpan: ' + error.message); }
        });

        // MODIFIKASI LOAD DATA: MERGE LOCALSTORAGE & FIRESTORE
        async function loadEvaluationData(npsn) {
            try {
                // 1. Ambil dari Firestore
                const docRef = doc(db, "evaluasi_sekolah", npsn);
                const docSnap = await getDoc(docRef);
                let firestoreData = docSnap.exists() ? docSnap.data() : {};
                
                // 2. Ambil dari LocalStorage
                const draftKey = `sakti_draft_${npsn}`;
                const draftJson = localStorage.getItem(draftKey);
                let localData = draftJson ? JSON.parse(draftJson) : {};

                // 3. Logic Merge: Gunakan yang paling baru update-nya
                let data = firestoreData;
                let usingDraft = false;

                if (localData.updatedAt && firestoreData.updatedAt) {
                    if (new Date(localData.updatedAt) > new Date(firestoreData.updatedAt)) {
                        data = { ...firestoreData, ...localData }; // Local overwrite cloud
                        usingDraft = true;
                    }
                } else if (localData.updatedAt && !firestoreData.updatedAt) {
                    data = localData;
                    usingDraft = true;
                }

                // STATUS BANNER LOGIC
                const banner = document.getElementById('status-banner');
                const icon = document.getElementById('status-icon');
                const title = document.getElementById('status-title');
                const desc = document.getElementById('status-desc');
                const btnEdit = document.getElementById('btn-request-edit');

                if (data.is_locked) {
                    lockForm(true);
                    banner.classList.remove('hidden');
                    
                    if (data.request_edit) {
                        banner.className = "max-w-4xl mx-auto mb-4 p-4 rounded-xl border flex items-center justify-between shadow-sm bg-blue-50 border-blue-200";
                        icon.className = "w-10 h-10 rounded-full flex items-center justify-center text-white text-lg bg-blue-500";
                        icon.innerHTML = '<i class="fas fa-clock"></i>';
                        title.innerText = "Menunggu Persetujuan";
                        title.className = "font-bold text-lg text-blue-800";
                        desc.innerText = "Pengajuan perubahan data sedang ditinjau oleh Supervisor.";
                        btnEdit.classList.add('hidden');
                    } else {
                        banner.className = "max-w-4xl mx-auto mb-4 p-4 rounded-xl border flex items-center justify-between shadow-sm bg-green-50 border-green-200";
                        icon.className = "w-10 h-10 rounded-full flex items-center justify-center text-white text-lg bg-green-500";
                        icon.innerHTML = '<i class="fas fa-check"></i>';
                        title.innerText = "Data Terkirim";
                        title.className = "font-bold text-lg text-green-800";
                        desc.innerText = "Anda sudah melakukan input data. Klik tombol di kanan jika ingin merubah.";
                        btnEdit.classList.remove('hidden');
                    }
                } else {
                    lockForm(false);
                    banner.classList.add('hidden');
                }

                // FILL FORM
                const nr = document.getElementById('nama_responden');
                const nw = document.getElementById('no_wa');
                if(data.nama_responden && nr) nr.value = data.nama_responden;
                if(data.no_wa && nw) nw.value = data.no_wa;

                Object.keys(data).forEach(key => {
                    if(key.startsWith('key_')) {
                        const radio = document.querySelector(`input[name="${key}"][value="${data[key]}"]`);
                        if(radio) { radio.checked = true; const secIdx = sections.findIndex(s => s.id === key.replace('key_', '')); if(secIdx !== -1) toggleQuestions(secIdx, data[key]); }
                    }
                });

                Object.keys(data).forEach(key => {
                    if(key.startsWith('key_')) return;
                    const el = document.getElementById(key) || document.querySelector(`[name="${key}"]`);
                    if(el) {
                        if(el.type === 'radio') { const radio = document.querySelector(`input[name="${key}"][value="${data[key]}"]`); if(radio) radio.checked = true; } 
                        else if (el.tagName === 'SELECT') {
                            const selectEl = document.getElementById('sel_' + key);
                            if(selectEl) { let optExists = [...selectEl.options].some(o => o.value === data[key]); if(optExists) { selectEl.value = data[key]; handleSelectWithOther(key, data[key]); } else { selectEl.value = 'Lainnya'; handleSelectWithOther(key, 'Lainnya'); const otherInput = document.getElementById('other_' + key); if(otherInput) otherInput.value = data[key]; document.getElementById(key).value = data[key]; } } 
                            else { el.value = data[key]; }
                        } else if (el.type === 'hidden') {
                            el.value = data[key]; const parts = data[key].split(', '); const checkboxes = document.querySelectorAll(`input[onchange^="updateCheckboxValue('${key}'"]`); checkboxes.forEach(cb => { if(parts.includes(cb.value)) cb.checked = true; const otherPart = parts.find(p => p.startsWith('Lainnya: ')); if(otherPart && cb.value === 'Lainnya') { cb.checked = true; const otherText = otherPart.replace('Lainnya: ', ''); const otherInput = document.getElementById(`other_text_${key}`); if(otherInput) { otherInput.classList.remove('hidden'); otherInput.value = otherText; } } });
                        } else { el.value = data[key]; }
                        
                        let triggerEl = el.type === 'radio' ? document.querySelector(`input[name="${key}"][value="${data[key]}"]`) : el;
                        if(triggerEl && triggerEl.getAttribute('onchange') && triggerEl.getAttribute('onchange').includes('handleConditional')) { const match = triggerEl.getAttribute('onchange').match(/handleConditional\('([^']+)'/); if(match) handleConditional(match[1], data[key]); }
                    }
                });
                
                if(usingDraft && !data.is_locked) showModal('info', 'Memuat draft tersimpan dari perangkat Anda.'); 
                else if(!data.is_locked && docSnap.exists()) showModal('info', 'Data draft dari server berhasil dimuat.');

                calculateProgress();
                updateNavButtons(); 
            } catch (e) { console.error("Load Error", e); }
        }

        function lockForm(locked) {
            const form = document.getElementById('evalForm');
            const inputs = form.querySelectorAll('input:not([type=hidden]), select, textarea, button[type="submit"]');
            
            if (locked) {
                inputs.forEach(el => {
                    if(el.id !== 'btnPrev' && el.id !== 'btnNext' && !el.closest('.absolute')) {
                        el.disabled = true;
                        el.classList.add('bg-gray-100', 'cursor-not-allowed');
                    }
                });
            } else {
                inputs.forEach(el => {
                    el.disabled = false;
                    el.classList.remove('bg-gray-100', 'cursor-not-allowed');
                });
            }
        }

        async function requestEdit() {
            if(!confirm("Apakah Anda yakin ingin mengajukan perubahan data ke Supervisor?")) return;
            
            const npsn = document.getElementById('hidden_npsn').value;
            try {
                await updateDoc(doc(db, "evaluasi_sekolah", npsn), { request_edit: true });
                showModal('success', 'Pengajuan berhasil dikirim. Menunggu persetujuan Supervisor.');
                loadEvaluationData(npsn);
            } catch(e) { showModal('error', 'Gagal mengajukan: ' + e.message); }
        }

        function runIntroSequence() {
            const introLayer = document.getElementById('intro-layer'); const flashLayer = document.getElementById('intro-flash'); const loginOverlay = document.getElementById('login-overlay'); const subTextContainer = document.getElementById('intro-sub-text'); const textToAnimate = "Sistem Asesmen dan Kurikulum Terintegrasi";
            subTextContainer.innerHTML = textToAnimate.split('').map(char => char === ' ' ? '<span class="intro-char mx-1">&nbsp;</span>' : `<span class="intro-char">${char}</span>`).join('');
            setTimeout(() => introLayer.classList.add('intro-active'), 300);
            setTimeout(() => { document.querySelectorAll('.intro-char').forEach((char, index) => setTimeout(() => char.classList.add('animate-bounce-in'), index * 35)); }, 1200);
            setTimeout(() => { flashLayer.style.opacity = '1'; setTimeout(() => { introLayer.style.display = 'none'; loginOverlay.style.opacity = '1'; flashLayer.style.transition = 'opacity 1.5s ease-out'; flashLayer.style.opacity = '0'; setTimeout(() => flashLayer.remove(), 1500); }, 150); }, 3800);
        }
    </script>
